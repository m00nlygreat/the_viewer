<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV 다이나믹 뷰 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── 앱 토큰 (src/styles/foundation.css와 동일) ── */
:root {
  font-family: 'Geist', 'Noto Sans KR', sans-serif; font-size: 16px; letter-spacing: -0.005em; color-scheme: dark;
  --bg:#0B0B0C; --sidebar:#0E0E10; --line:#1E1F22; --row-line:#17181B; --text:#E6E6E8; --text-strong:#F2F2F3; --body:#D4D5D8;
  --text-secondary:#C9CACE; --text-muted:#8A8B91; --text-weak:#7D7E85; --selected:#1D1E21; --selected-row:#131418; --selected-cell:#161830;
  --accent:#A4AAF7; --warning:#E0A33A; --danger:#F08A8A; --control:#141416; --control-active:#26272B; --button-line:#2A2B30;
  --primary:#5B63D3; --primary-line:#6A72E0; --panel:#101012; --panel-raised:#151518; --shadow:0 18px 60px rgb(0 0 0 / 42%);
  --font-mono:'Geist Mono', 'Noto Sans Mono', monospace;
  --c0:#93C5FD; --c1:#86EFAC; --c2:#FCA5A5; --c3:#FCD34D; --c4:#C4B5FD; --c5:#67E8F9;
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg:#FCFCFD; --sidebar:#F4F4F6; --line:#E4E4E8; --row-line:#EEEEF1; --text:#1C1D21; --text-strong:#0F1013; --body:#2E2F34;
  --text-secondary:#3D3E44; --text-muted:#62636A; --text-weak:#6E6F76; --selected:#E6E6EB; --selected-row:#F4F5FE; --selected-cell:#ECEEFD;
  --accent:#4A52C4; --warning:#A0650F; --danger:#B42318; --control:#EFEFF2; --control-active:#FFFFFF; --button-line:#DADADF;
  --panel:#FFFFFF; --panel-raised:#FFFFFF; --shadow:0 18px 60px rgb(18 20 40 / 18%);
  --c0:#1D4ED8; --c1:#15803D; --c2:#B91C1C; --c3:#A16207; --c4:#6D28D9; --c5:#0E7490;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #050506; color: var(--text); overflow: hidden; }
:root[data-theme='light'] body { background: #DCDCE2; }
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: transparent; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { min-width: 0; background: var(--control); border: 1px solid var(--button-line); border-radius: 6px; height: 28px; padding: 0 8px; font-size: 12px; }
svg.i { width: 15px; height: 15px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 13px; height: 13px; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-weak); }

/* ── 프레임 ── */
.stage { height: 100%; display: flex; justify-content: center; }
.app { width: 100%; height: 100%; display: flex; background: var(--bg); overflow: hidden; position: relative; }
.app.is-mobile { width: 390px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); flex-direction: column; }

/* ── 사이드바 ── */
.sidebar { width: 232px; min-width: 232px; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 14px; background: var(--sidebar); border-right: 1px solid var(--line); }
.brand { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 7px; color: var(--text-strong); font-size: 14px; font-weight: 550; }
.brand-logo { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, var(--primary), var(--accent)); }
.side-cmd { width: 100%; min-height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: var(--text-secondary); font-size: 14px; text-align: left; }
.side-cmd:hover { background: var(--selected); }
.side-heading { padding: 5px 7px 2px; color: var(--text-weak); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
.doc-row { min-height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 7px; border-radius: 6px; color: var(--text-secondary); font-size: 13px; }
.doc-row.active { background: var(--selected); color: var(--text-strong); }
.file-badge { flex: 0 0 34px; height: 17px; display: inline-grid; place-items: center; border: 1px solid var(--button-line); border-radius: 4px; color: var(--text-muted); font: 11px/1 var(--font-mono); }
.file-badge.csv { color: #79CFA0; border-color: color-mix(in srgb, #42A773 36%, var(--button-line)); }
.file-badge.md { color: #B8A2FA; border-color: color-mix(in srgb, #8C70DC 36%, var(--button-line)); }
.dirty-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--warning); }
.side-bottom { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 8px; min-height: 30px; color: var(--text-secondary); font-size: 13px; }
.side-bottom .mono { margin-left: auto; color: var(--text-weak); font-size: 12px; }

/* ── 메인 / 탑바 ── */
.main { min-width: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { height: 48px; min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.topbar-doc { min-width: 0; display: flex; align-items: center; gap: 8px; flex: 0 1 auto; }
.topbar-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text-strong); font-size: 14px; font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 4px; min-height: 18px; padding: 0 6px; border: 1px solid var(--button-line); border-radius: 5px; color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.pill.warn { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
.pill.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 34%, transparent); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--text-muted); flex: 0 0 auto; }
.icon-btn:hover { background: var(--control-active); color: var(--text-strong); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; background: transparent; }
.divider { width: 1px; height: 20px; margin: 0 3px; background: var(--line); flex: 0 0 auto; }
.primary-btn, .secondary-btn { min-height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--primary-line); border-radius: 6px; color: #fff; background: var(--primary); font-size: 13px; font-weight: 520; white-space: nowrap; }
.secondary-btn { border-color: var(--button-line); color: var(--text-secondary); background: var(--control); }
.secondary-btn:hover { background: var(--control-active); color: var(--text-strong); }
.danger-btn { color: var(--danger); }

/* ── 탭: [사용자 뷰들] [+ 보기 추가] | [보기] [원본] ── */
.tabbar { display: flex; align-items: center; gap: 4px; min-width: 0; }
.mode-switch { padding: 2px; display: flex; gap: 1px; border: 1px solid var(--line); border-radius: 7px; background: var(--control); min-width: 0; }
.mode-switch button { height: 24px; min-width: 42px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; border-radius: 5px; color: var(--text-muted); font-size: 13px; white-space: nowrap; }
.mode-switch button:hover { color: var(--text); }
.mode-switch button.active { color: var(--text-strong); background: var(--control-active); box-shadow: 0 1px 2px rgb(0 0 0 / 15%); }
.mode-switch button .i { width: 13px; height: 13px; color: var(--text-weak); }
.mode-switch button.active .i { color: var(--accent); }
.views-switch { max-width: min(42vw, 520px); overflow-x: auto; scrollbar-width: none; }
.views-switch::-webkit-scrollbar { display: none; }
.add-view { height: 28px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; border: 1px dashed var(--button-line); border-radius: 7px; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.add-view:hover { color: var(--text-strong); border-color: var(--text-weak); }
.tab-sep { width: 1px; height: 18px; background: var(--button-line); margin: 0 4px; }

/* ── 뷰 툴바 ── */
.workspace { min-height: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.toolbar { min-height: 44px; padding: 6px 12px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tb-btn { height: 27px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 5px; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.tb-btn:hover { border-color: var(--line); background: var(--control); color: var(--text); }
.tb-btn.icon-only { width: 28px; padding: 0; justify-content: center; }
.chip { height: 25px; padding: 0 4px 0 8px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--button-line)); border-radius: 13px; background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.chip b { font-weight: 500; color: var(--text-strong); }
.chip .x { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; color: var(--text-weak); }
.chip .x:hover { background: var(--control-active); color: var(--text); }
.chip.ghost { border-style: dashed; border-color: var(--button-line); background: transparent; color: var(--text-muted); padding-right: 8px; }
.search { width: 200px; height: 28px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; color: var(--text-weak); background: var(--control); font-size: 12px; }
.spacer { flex: 1; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 32px; z-index: 30; min-width: 190px; padding: 4px; border: 1px solid var(--button-line); border-radius: 8px; background: var(--panel-raised); box-shadow: var(--shadow); }
.menu button { width: 100%; min-height: 30px; padding: 0 9px; display: flex; align-items: center; gap: 9px; border-radius: 5px; color: var(--text-secondary); font-size: 13px; text-align: left; }
.menu button:hover { background: var(--selected); color: var(--text-strong); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu .hint { padding: 4px 9px 6px; color: var(--text-weak); font-size: 11px; }

/* ── 배너 ── */
.banner { padding: 8px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 6%, var(--bg)); color: var(--text-secondary); font-size: 12px; }
.banner.warn { background: color-mix(in srgb, var(--warning) 8%, var(--bg)); color: var(--warning); border-bottom-color: color-mix(in srgb, var(--warning) 26%, var(--line)); }
.banner .i { color: var(--accent); }
.banner.warn .i { color: var(--warning); }

/* ── 조회 표 ── */
.grid-wrap { min-height: 0; flex: 1; overflow: auto; }
table.qt { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 13px; }
.qt th, .qt td { height: 34px; padding: 0 10px; border-bottom: 1px solid var(--row-line); border-right: 1px solid var(--row-line); white-space: nowrap; text-align: left; }
.qt thead th { position: sticky; top: 0; z-index: 2; height: 34px; background: var(--sidebar); border-bottom-color: var(--line); color: var(--text-muted); font-weight: 500; font-size: 12px; }
.qt th.rn, .qt td.rn { position: sticky; left: 0; z-index: 1; width: 52px; min-width: 52px; text-align: right; color: var(--text-weak); font: 11px var(--font-mono); background: var(--bg); }
.qt thead th.rn { z-index: 3; background: var(--sidebar); }
.qt tbody tr:hover td { background: var(--selected-row); }
.th-inner { display: flex; align-items: center; gap: 6px; }
.th-btn { display: inline-flex; align-items: center; gap: 6px; padding: 3px 5px; margin: 0 -5px; border-radius: 5px; color: inherit; font-size: 12px; font-weight: 500; }
.th-btn:hover { background: var(--control-active); color: var(--text-strong); }
.type-ic { width: 18px; height: 16px; display: inline-grid; place-items: center; border-radius: 4px; background: var(--control); color: var(--text-muted); font: 10px/1 var(--font-mono); }
.th-sort { color: var(--accent); }
.td-num { text-align: right !important; font-family: var(--font-mono); font-size: 12px; }
.sel { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 12px; background: color-mix(in srgb, var(--sc) 14%, transparent); color: var(--sc); border: 1px solid color-mix(in srgb, var(--sc) 28%, transparent); }
.sel.unreg { --sc: var(--text-muted); border-style: dashed; }
.tag { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; margin-right: 3px; border-radius: 4px; background: var(--control); border: 1px solid var(--button-line); color: var(--text-secondary); font-size: 11px; }
.bool { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-secondary); }
.bool .box { width: 14px; height: 14px; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--button-line); }
.bool.on .box { background: var(--primary); border-color: var(--primary-line); color: #fff; }
.st-empty { color: var(--text-weak); font-size: 11px; font-style: italic; }
.st-missing { display: inline-block; padding: 0 6px; color: var(--text-weak); font-size: 11px; border-radius: 4px; background: repeating-linear-gradient(135deg, transparent 0 4px, var(--control) 4px 8px); }
.st-null { color: var(--text-weak); font: 11px var(--font-mono); }
.st-invalid { display: inline-flex; align-items: center; gap: 5px; color: var(--warning); font: 12px var(--font-mono); }
.st-invalid::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }
td.cell-invalid { background: color-mix(in srgb, var(--warning) 7%, transparent); box-shadow: inset 2px 0 0 var(--warning); }
tr.loading td { color: var(--text-weak); }
.skel { display: inline-block; height: 9px; border-radius: 4px; background: var(--control-active); opacity: .6; }
.statusbar { height: 28px; flex: 0 0 auto; padding: 0 12px; display: flex; align-items: center; gap: 13px; border-top: 1px solid var(--line); color: var(--text-weak); background: var(--sidebar); font: 11px var(--font-mono); white-space: nowrap; overflow: hidden; }
.statusbar .warn { color: var(--warning); }
.link-btn { color: var(--accent); font: inherit; padding: 0; }
.link-btn:hover { text-decoration: underline; }

/* ── 갤러리 ── */
.gallery { min-height: 0; flex: 1; overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; align-content: start; }
.card { padding: 12px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); display: flex; flex-direction: column; gap: 9px; }
.card:hover { border-color: var(--button-line); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-title { color: var(--text-strong); font-size: 14px; font-weight: 550; }
.card-sub { color: var(--text-weak); font: 11px var(--font-mono); margin-top: 2px; }
.card-fields { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12px; align-items: center; }
.card-fields dt { color: var(--text-weak); }
.card-fields dd { margin: 0; color: var(--text-secondary); text-align: right; }
.load-more-tile { border: 1px dashed var(--button-line); border-radius: 9px; display: grid; place-items: center; color: var(--text-muted); font-size: 12px; min-height: 150px; }

/* ── 리스트 ── */
.list { min-height: 0; flex: 1; overflow: auto; }
.list-group-head { position: sticky; top: 0; z-index: 1; height: 30px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: var(--sidebar); color: var(--text-muted); font-size: 12px; font-weight: 500; }
.list-group-head .count { color: var(--text-weak); font: 11px var(--font-mono); }
.list-group-head.warn { color: var(--warning); }
.list-item { min-height: 58px; padding: 9px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--row-line); }
.list-item:hover { background: var(--selected-row); }
.list-item.selected { background: var(--selected-cell); box-shadow: inset 2px 0 0 var(--accent); }
.list-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sc); flex: 0 0 auto; }
.list-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.list-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.list-title b { color: var(--text-strong); font-size: 14px; font-weight: 550; white-space: nowrap; }
.list-title .mono { color: var(--text-weak); font-size: 11px; }
.list-sub { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; color: var(--text-weak); font-size: 12px; white-space: nowrap; }
.list-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
.list-side .amt { font: 13px var(--font-mono); color: var(--text-secondary); }
.urgent { height: 18px; padding: 0 6px; display: inline-flex; align-items: center; border-radius: 4px; font-size: 11px; color: var(--c2); background: color-mix(in srgb, var(--c2) 12%, transparent); }
.list-end { padding: 14px 16px; color: var(--text-weak); font-size: 12px; text-align: center; }
.app.is-mobile .list-item { padding: 10px 12px; }
.app.is-mobile .list-group-head { padding: 0 12px; }

/* ── 칸반 ── */
.kanban { min-height: 0; flex: 1; overflow: auto; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.kcol { width: 264px; min-width: 264px; max-height: 100%; display: flex; flex-direction: column; border-radius: 9px; background: var(--sidebar); border: 1px solid var(--line); }
.kcol-head { height: 40px; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
.kcol-head .count { color: var(--text-weak); font: 11px var(--font-mono); }
.kcol-body { padding: 8px; display: flex; flex-direction: column; gap: 7px; overflow: auto; }
.kcard { padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.kcard .t { color: var(--text-strong); font-size: 13px; font-weight: 500; }
.kcard .row { display: flex; align-items: center; justify-content: space-between; color: var(--text-weak); }
.kmore { height: 30px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; color: var(--text-muted); font-size: 12px; }
.kmore:hover { background: var(--selected); color: var(--text); }
.kcol.special .kcol-head { color: var(--text-muted); }
.kcol.warn .kcol-head { color: var(--warning); }
.kcol.addgroup { background: transparent; border-style: dashed; min-height: 120px; display: grid; place-items: center; color: var(--text-muted); font-size: 12px; text-align: center; padding: 16px; }

/* ── 캘린더 ── */
.cal { min-height: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.cal-head { height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.cal-head h3 { margin: 0 6px; font-size: 15px; font-weight: 550; color: var(--text-strong); }
.cal-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(92px, 1fr); overflow: auto; }
.cal-dow { position: sticky; top: 0; height: 28px; display: flex; align-items: center; padding: 0 8px; font-size: 11px; color: var(--text-weak); border-bottom: 1px solid var(--line); background: var(--bg); z-index: 1; }
.cal-day { border-right: 1px solid var(--row-line); border-bottom: 1px solid var(--row-line); padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal-day.out { background: color-mix(in srgb, var(--sidebar) 60%, transparent); }
.cal-day.out .dn { color: var(--text-weak); opacity: .6; }
.cal-day .dn { font: 11px var(--font-mono); color: var(--text-muted); }
.cal-day.today .dn { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; }
.ev { height: 20px; padding: 0 6px; display: flex; align-items: center; gap: 5px; border-radius: 4px; font-size: 11px; color: var(--text-secondary); background: color-mix(in srgb, var(--sc) 13%, transparent); border-left: 2px solid var(--sc); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ev-more { font-size: 11px; color: var(--text-muted); padding: 0 4px; text-align: left; }
.ev-more:hover { color: var(--accent); }

/* ── 원본 ── */
.source { min-height: 0; flex: 1; overflow: auto; padding: 10px 0; font: 13px/1.65 var(--font-mono); color: var(--body); }
.source .ln { display: flex; }
.source .ln span:first-child { width: 56px; padding-right: 14px; text-align: right; color: var(--text-weak); flex: 0 0 auto; user-select: none; }
.range-bar { height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-muted); }
.range-track { flex: 1; height: 6px; border-radius: 3px; background: var(--control); position: relative; max-width: 360px; }
.range-track i { position: absolute; left: 0; top: 0; bottom: 0; width: 3%; border-radius: 3px; background: var(--accent); }

/* ── 빈 상태 ── */

const fmtNum = (s) => { const [i, f] = s.split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : ''); };
function cell(col, v) {
  if (v && typeof v === 'object') {
    if (v.s === 'empty') return { html: '<span class="st-empty">빈 값</span>' };
    if (v.s === 'missing') return { html: '<span class="st-missing">누락</span>' };
    if (v.s === 'null') return { html: `<span class="st-null" title="결측 표식">${v.raw}</span>` };
    if (v.s === 'invalid') return { html: `<span class="st-invalid" title="해석 실패: ${v.why}">${v.raw}</span>`, cls: 'cell-invalid' };
  }
  switch (col.type) {
    case 'decimal': return { html: '₩' + fmtNum(v), cls: 'td-num' };
    case 'integer': return { html: v, cls: 'td-num' };
    case 'date': return { html: `<span class="mono" style="font-size:12px">${v}</span>` };
    case 'boolean': return { html: v === '1' ? `<span class="bool on"><span class="box">${ic('check', 'sm')}</span></span>` : '<span class="bool"><span class="box"></span></span>' };
    case 'select': return { html: STATUS[v] ? `<span class="sel" style="--sc:${STATUS[v]}">${v}</span>` : `<span class="sel unreg" title="선택지 밖 값 (원문 레이블로 표시)">${v}</span>` };
    case 'multiSelect': return { html: v ? v.split(';').map(t => `<span class="tag">${t}</span>`).join('') : '<span class="st-empty">빈 값</span>' };
    default: return { html: v, cls: col.id === 'c_no' ? 'mono' : '' };
  }
}

function tableHTML(v, rows, opt = {}) {

  let body = '';
  if (opt.skeleton) {
    for (let i = 0; i < opt.skeleton; i++) body += `<tr class="loading"><td class="rn"></td>${cols.map((c, j) => `<td><span class="skel" style="width:${40 + ((i * 7 + j * 13) % 50)}px"></span></td>`).join('')}</tr>`;
  } else {
    body = rows.map(r => `<tr><td class="rn">${r[0]}</td>${cols.map(c => { const x = cell(c, val(r, c.id)); return `<td class="${x.cls || ''}">${x.html}</td>`; }).join('')}</tr>`).join('');
    if (opt.moreRow) body += `<tr class="loading"><td class="rn">…</td><td colspan="${cols.length}" class="muted" style="font-size:12px">다음 200행 불러오는 중 · 스크롤 끝에서 이어서 조회합니다</td></tr>`;
  }
  return `<table class="qt"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function listHTML() {
  // 주문일 내림차순, 날짜별 묶음. 해석 실패 날짜는 상태 순서대로 맨 뒤 묶음

  return `<div class="list">${html}</div>`;

function calendarHTML() {
  // 2026-11: 1일 = 일요일. 월간 화면은 앞뒤 주 포함
  const days = [];
  for (let i = 0; i < 35; i++) days.push(i + 1);
  const byDate = {};
  ROWS.forEach(r => { const d = val(r, 'c_date'); if (typeof d === 'string' && val(r, 'c_status') !== '취소') (byDate[d] ||= []).push(r); });
  const dow = ['일', '월', '화', '수', '목', '금', '토'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  const cells = days.map(n => {
    const out = n > 30; const dn = out ? n - 30 : n;
    const key = out ? `2026-12-${String(dn).padStart(2, '0')}` : `2026-11-${String(dn).padStart(2, '0')}`;
    const items = byDate[key] || [];
    const shown = items.slice(0, 2).map(r => `<div class="ev" style="--sc:${STATUS[val(r, 'c_status')] || 'var(--text-muted)'}">${val(r, 'c_cust')} · ${val(r, 'c_no')}</div>`).join('');
    const extra = key === '2026-11-16' ? 3 : (items.length > 2 ? items.length - 2 : 0);
    return `<div class="cal-day ${out ? 'out' : ''} ${key === '2026-11-16' ? 'today' : ''}"><span class="dn">${dn}</span>${shown}${extra ? `<button class="ev-more">+${extra} 더 보기</button>` : ''}</div>`;
  }).join('');
  return `<div class="cal">
    <div class="cal-head"><button class="icon-btn">${ic('left')}</button><h3>2026년 11월</h3><button class="icon-btn">${ic('right')}</button><button class="secondary-btn" style="min-height:26px;font-size:12px">오늘</button>
      <span class="spacer"></span><span class="muted" style="font-size:11px">조회 범위 2026-11-01 ~ 2026-12-06 (끝 제외) · 날짜 전용, 시간대 이동 없음</span></div>
    <div class="cal-grid">${dow}${cells}</div>
    <div class="banner warn" style="border-top:1px solid var(--line);border-bottom:0">${ic('alert', 'sm')}<span>날짜 해석 실패 1행(#7 <span class="mono">2026-02-30</span>)은 캘린더에 표시되지 않습니다.</span><button class="link-btn" style="margin-left:auto">표로 보기</button></div>
  </div>`;
}

function editorTableHTML() {
  const head = `<tr><th class="rn"></th>${COLS.map(c => `<th>${c.name}</th>`).join('')}</tr>`;

}

function sourceHTML() {
  const raw = (v) => v && typeof v === 'object' ? (v.s === 'missing' ? null : (v.raw ?? '')) : v;
  const lines = [COLS.map(c => c.name).join(',')].concat(ROWS.map(r => COLS.map(c => raw(val(r, c.id))).filter(x => x !== null).map(x => /[,;]/.test(x) ? `"${x}"` : x).join(',')));
  const body = lines.map((l, i) => `<div class="ln"><span>${i + 1}</span><span>${l}</span></div>`).join('');
  if (isLarge()) return `<div class="range-bar">${ic('file', 'sm')}<span class="mono">0 – 1,048,576 B</span><span class="muted">/ 1.24 GB</span><div class="range-track"><i></i></div><button class="secondary-btn" style="min-height:26px;font-size:12px">위치로 이동</button><span class="spacer"></span><span class="muted">읽기 전용 범위 보기 · 전체 Monaco 모델 없음</span></div><div class="source">${body}<div class="ln"><span>…</span><span class="muted">스크롤하면 다음 1 MiB 범위를 읽습니다</span></div></div>`;
  return `<div class="source">${body}</div>`;
}

        <div class="seg">${types.map(t => `<button class="${draft === t ? 'active' : ''}" data-draft="${t}"><span class="type-ic">${TYPE_IC[t]}</span>${TYPE_LABEL[t]}${sm.rec === t ? '<span class="rec">추천</span>' : ''}</button>`).join('')}</div>
        <div class="evidence">
          <span>표본 <b>${sm.of}</b>행 중 <b>${sm.match}</b>개 일치 <span class="meter"><i style="width:${sm.match / sm.of * 100}%"></i></span></span>
          <span>파일 끝 ${sm.eof ? '확인' : '<b style="color:var(--warning)">미도달</b>'}</span>
          <span class="muted">처음 200개 레코드 · 최대 8 MiB 표본. 전체 검증 아님</span>
        </div>
        ${sm.note ? `<div class="impact" style="border-color:var(--line);background:transparent">${ic('info', 'sm')} ${sm.note}</div>` : ''}
        <div class="section-title">입력 규칙</div>
        <div class="rules">${rules}</div>
        <div class="section-title">원문 → 해석값 미리보기</div>
        <table class="sample"><thead><tr><th>원문</th><th>해석값</th><th>상태</th></tr></thead><tbody>${sm.rows.map(([a, b, s]) => `<tr><td>${a === '' ? '<span class="st-empty">""</span>' : a}</td><td>${s === 'ok' ? b : `<span class="muted">${b}</span>`}</td><td class="status">${status(s)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">표본 예시 없음</td></tr>'}</tbody></table>
        ${changed || S.typeCol === 'c_amt' ? `<div class="impact"><strong>${ic('info', 'sm')} 적용하면 영향을 받는 뷰 2개</strong><span>· 진행 중 주문 — 표시 컬럼</span><span>· 상태 보드 — 정렬 기준 (금액 내림차순)</span><span class="muted">적용 후 열린 뷰를 다시 조회합니다. CSV 원문은 바뀌지 않습니다.</span></div>` : ''}
      </div>
    </div>
    <div class="dlg-foot"><span class="note">표본 밖 예외는 타입을 바꾸지 않고 <b>해석 실패</b>로 표시합니다.</span><span class="spacer"></span><button class="secondary-btn" data-act="close">취소</button><button class="primary-btn" data-act="close">적용</button></div>
  </div></div>`;
}

function managerHTML() {
  return `<div class="overlay"><div class="dialog narrow" role="dialog" aria-label="보기 관리">
    <div class="dlg-head"><h2>보기 관리</h2><span class="sub">${fileName()} · 뷰 ${VIEWS.length}개</span><span class="spacer"></span><button class="icon-btn" data-act="close">${ic('x')}</button></div>
    <div class="dlg-body" style="flex-direction:column">
      <div class="mgr-list">${VIEWS.map((v, i) => `<div class="mgr-item ${i === 1 ? 'dragging' : ''}"><span class="grip">${ic('grip')}</span><span class="lay-ic">${ic(LAYOUT[v.layout][0])}</span>
        <div><div class="nm">${v.name}</div><div class="meta">${LAYOUT[v.layout][1]} · ${['컬럼 6 · 필터 1 · 정렬 1', '그룹 상태 · 정렬 1', '날짜 주문일 · 필터 1', '컬럼 5 · 정렬 1', '묶음 주문일 · 필터 1'][i]} · 11월 ${11 + i}일 수정</div></div>
        <div class="acts"><button class="icon-btn" title="이름 변경">${ic('edit')}</button><button class="icon-btn desk-act" title="복제">${ic('copy')}</button><button class="icon-btn desk-act" title="뷰 다운로드">${ic('download')}</button><button class="icon-btn danger-btn" title="삭제">${ic('trash')}</button></div></div>`).join('')}
        <div class="mgr-item"><button class="mini-btn" data-act="add-view">${ic('plus', 'sm')}보기 추가</button></div>
      </div>
      <div class="mgr-note">뷰 설정은 이 브라우저에 파일별로 보관되며 CSV 저장·수정 상태와 별개입니다. 같은 파일을 다시 열면 자동으로 연결됩니다. 다른 기기로 옮기려면 JSON으로 내려받으세요. CSV 행 데이터·로컬 경로는 포함되지 않습니다.</div>
    </div>
    <div class="dlg-foot"><button class="secondary-btn" data-act="import">${ic('upload', 'sm')}뷰 가져오기</button><button class="secondary-btn">${ic('download', 'sm')}모든 뷰 다운로드</button><span class="spacer"></span><button class="primary-btn" data-act="close">완료</button></div>
  </div></div>`;
}

function importHTML() {
  const map = [['주문번호', '주문번호', 'ok'], ['고객명', '', 'need'], ['상태', '상태', 'ok'], ['금액', '금액', 'type'], ['주문일', '주문일', 'ok']];
  return `<div class="overlay"><div class="dialog narrow" role="dialog" aria-label="뷰 가져오기">
    <div class="dlg-head"><h2>뷰 가져오기</h2><span class="sub">orders.views.json</span><span class="spacer"></span><button class="icon-btn" data-act="close">${ic('x')}</button></div>
    <div class="dlg-body" style="flex-direction:column"><div class="pane" style="display:flex;flex-direction:column;gap:14px">
      <div class="steps"><span>1 검증</span><span class="on">2 컬럼 연결</span><span>3 충돌 조정</span><span>4 적용</span></div>
      <div class="evidence"><span>검증 완료 · 스키마 v1</span><span>뷰 <b>3</b>개</span><span>컬럼 <b>5</b>개 참조</span></div>
      <table class="map-table"><thead><tr><th>가져온 컬럼</th><th>현재 파일 컬럼</th><th></th></tr></thead><tbody>
      ${map.map(([a, b, s]) => `<tr><td>${a}</td><td><select>${b ? `<option>${b}</option>` : '<option>연결할 컬럼 선택…</option>'}${COLS.map(c => `<option>${c.name}</option>`).join('')}</select></td><td style="width:150px;font-size:11px">${s === 'ok' ? `<span class="ok">${ic('check', 'sm')} 헤더 일치</span>` : s === 'need' ? '<span style="color:var(--warning)">헤더 없음 · 연결 필요</span>' : '<span style="color:var(--warning)">타입 다름</span>'}</td></tr>`).join('')}
      </tbody></table>
      <div class="impact"><strong>금액: 가져온 타입 정수 ↔ 현재 타입 소수</strong>
        <label class="check-line"><span class="cb on" style="border-radius:50%">${ic('check', 'sm')}</span>현재 타입(소수) 유지</label>
        <label class="check-line"><span class="cb" style="border-radius:50%"></span>공통 스키마를 정수로 변경 — 기존 뷰 2개에 영향</label></div>
      <span class="muted" style="font-size:12px">같은 ID의 뷰가 이미 있으면 기본으로 새 뷰로 복제합니다. 취소하면 아무것도 바뀌지 않습니다.</span>
    </div></div>
    <div class="dlg-foot"><span class="spacer"></span><button class="secondary-btn" data-act="close">취소</button><button class="primary-btn" disabled style="opacity:.5">다음</button></div>
  </div></div>`;
}

// ───────────── 이벤트 ─────────────
document.getElementById('app').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-act],[data-layout],[data-typecol],[data-draft]');
  if (!t) { if (S.menu) { S.menu = null; render(); } return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.menu = null; }
  else if (t.dataset.layout) { S.builder.layout = t.dataset.layout; if (t.dataset.layout === 'kanban') S.builder.group = ''; if (t.dataset.layout === 'calendar') S.builder.date = ''; }
  else if (t.dataset.typecol) { S.typeCol = t.dataset.typecol; S.typeDraft = colById(S.typeCol).type; }
  else if (t.dataset.draft) { S.typeDraft = t.dataset.draft; }
  else {
    const a = t.dataset.act; S.menu = a === 'view-menu' ? (S.menu ? null : 'view') : null;
    if (a === 'theme') S.theme = S.theme === 'dark' ? 'light' : 'dark';
    if (a === 'close') S.dialog = null;
    if (a === 'add-view') { S.dialog = 'builder'; S.builder = { name: '새 보기', layout: 'calendar', group: '', date: '', editing: null }; }
    if (a === 'edit-view') { const v = VIEWS.find(x => x.id === S.tab) || VIEWS[0]; S.dialog = 'builder'; S.builder = { name: v.name, layout: v.layout, group: 'c_status', date: 'c_date', editing: v.id }; }
    if (a === 'types') { S.dialog = 'types'; if (t.dataset.col) { S.typeCol = t.dataset.col; } S.typeDraft = colById(S.typeCol).type; }
    if (a === 'manager') S.dialog = 'manager';
    if (a === 'import') S.dialog = 'import';
  }
  render();
});
document.getElementById('app').addEventListener('change', (e) => {
  const b = e.target.dataset.bind; if (b) { S.builder[b] = e.target.value; render(); }
});
document.getElementById('app').addEventListener('keydown', (e) => {
  const tab = e.target.closest('[role=tab]'); if (!tab || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  const all = [...tab.closest('.tabbar').querySelectorAll('[role=tab]')];
  let i = all.indexOf(tab);
  i = e.key === 'Home' ? 0 : e.key === 'End' ? all.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length;
  S.tab = all[i].dataset.tab; render();
  document.querySelector(`.topbar [data-tab="${S.tab}"], .mobile-tabs [data-tab="${S.tab}"]`)?.focus();
  e.preventDefault();
});
document.getElementById('mockCtl').addEventListener('click', (e) => {
  if (e.target.id === 'mcMin') { e.currentTarget.classList.toggle('min'); e.target.textContent = e.currentTarget.classList.contains('min') ? '펼치기' : '접기'; return; }
  const b = e.target.closest('button[data-v]'); if (!b) return;
  S[b.parentElement.dataset.key] = b.dataset.v; S.dialog = null; render();
});
function syncCtl() {
  document.querySelectorAll('.mock-ctl .opts').forEach(o => o.querySelectorAll('button').forEach(b => b.classList.toggle('on', S[o.dataset.key] === b.dataset.v)));
}
if (window.innerWidth < 760) S.device = 'mobile';
render();
</script>
</body>
</html>
